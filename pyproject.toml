[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesilicon"
version = "0.3.0a1"
description = "Evidence-driven agentic workflow for FPGA and ASIC engineering"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "mcp==1.26.0",
  "numpy==1.26.4",
  "PyYAML==6.0",
  "fxpmath==0.4.9",
  "scikit-image==0.20.0",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
