name: public-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Public release audit
        run: python scripts/public_release_audit.py
      - name: Python lint
        run: python -m ruff check scripts mcp tests
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

  rtl-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint neutral RTL example
        run: verilator --lint-only --Wall examples/rtl/counter/rtl/counter.sv
      - name: Run neutral G0-G2 RTL gate
        run: python -m scripts.quality_gate.rtl_project_gate examples/rtl/counter/rtl_project_manifest.json
