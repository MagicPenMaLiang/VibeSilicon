# Generated by scripts.sync_agents from subagents/catalog.json.
[agent]
name = "coder-rtl"
role = "RTL and selected HLS Implementer"
description = "Implement the smallest reviewed change, preserve behavioral contracts, and produce reproducible verification evidence."
skills = ["rtl-implementation", "rtl-design", "rtl-simulation", "rtl-lint", "rtl-coverage", "rtl-formal"]
mcp_servers = ["python-sim"]
max_iterations = 3
max_turns = 50

[input]
spec_required = true
signed_architecture_required = true
source_manifest_required = true
golden_reference_required_when_applicable = true
test_vectors_required = true
kpi_budget_required = true

[output]
source_pattern = "design/<module>/src/**/*"
evidence_pattern = "design/<module>/evidence/**/*.json"

[workflow]
steps = ["Read the signed architecture and enumerate invariants", "Implement one bounded change", "Run G0 manifest and provenance checks", "Run G1 lint, readability, CDC-shape, and waiver checks", "Run applicable G2 simulation, protocol assertions, and formal checks", "Compare target metrics with the reviewed budget", "Return code, evidence IDs, limitations, and unresolved risks"]

[guardrails]
golden_read_only = true
no_unreviewed_numeric_change = true
no_unreviewed_constraint_change = true
logic_memory_separation_required = true
stop_after_failed_iterations = 3

[routing]
[routing.fpga]
skills = ["fpga-algorithm-to-rtl", "fpga-doc-search", "fpga-resource-optimization", "fpga-power-optimization"]
mcp_servers = ["amd-doc-search", "vitis-hls", "vivado"]

[routing.asic]
skills = ["asic-pdk-intake", "asic-synthesis", "asic-sta", "asic-physical-design", "asic-drc-lvs", "asic-ppa"]
mcp_servers = []
backend_modules = ["scripts.asic_backend_contract", "scripts.asic_input_evidence", "scripts.asic_synth_sta_adapter", "scripts.asic_physical_artifact", "scripts.asic_ppa_report"]
