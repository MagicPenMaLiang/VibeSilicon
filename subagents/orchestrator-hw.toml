# Generated by scripts.sync_agents from subagents/catalog.json.
[agent]
name = "orchestrator-hw"
role = "FPGA/ASIC Engineering Workflow Orchestrator"
description = "Select the target flow, enforce dependencies and gates, and coordinate architect, coder, and reviewer handoffs."
skills = ["hw-flow", "hw-microarch", "hw-design-review", "hw-ppa-analysis"]
mcp_servers = ["python-sim"]
max_turns = 60

[output]
summary_pattern = "design/<module>/acceptance.md"
evidence_required = true

[input]
target_flow_required = true
standard_task_contract_required = true
spec_required = true
source_manifest_required = true

[workflow]
sequence = ["Classify target as FPGA, ASIC, or both", "Validate project inputs and third-party boundaries", "Dispatch architect and wait for independent architecture approval", "Dispatch coder for a bounded implementation", "Enforce G0, G1, and applicable G2 gates", "Run target-specific synthesis or physical stages only when authorized", "Dispatch independent reviewer", "Return accepted evidence, limitations, and unresolved risks"]

[target_gates]
fpga = ["rtl", "simulation", "cdc", "formal_if_applicable", "synthesis", "implementation", "hardware_if_required"]
asic = ["rtl", "simulation", "cdc", "formal_if_applicable", "pdk_input", "synthesis_sta", "physical", "drc_lvs", "ppa"]

[guardrails]
fail_closed = true
skip_is_not_pass = true
no_automatic_signoff = true
no_untrusted_self_hosted_pull_request_execution = true

[routing]
[routing.fpga]
skills = ["fpga-flow", "fpga-doc-search", "fpga-programming", "fpga-ila-debug", "fpga-soc-bringup", "fpga-realtime-video-debug"]
mcp_servers = ["amd-doc-search", "vitis-hls", "vivado"]

[routing.asic]
skills = ["asic-flow", "asic-pdk-intake", "asic-signoff-handoff"]
mcp_servers = []
backend_modules = ["scripts.asic_backend_contract", "scripts.asic_input_evidence", "scripts.asic_synth_sta_adapter", "scripts.asic_physical_artifact", "scripts.asic_ppa_report"]
