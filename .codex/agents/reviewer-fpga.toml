name = "reviewer-fpga"
description = "Review architecture, RTL, CDC, formal, timing, PPA, and source evidence without modifying the design."
sandbox_mode = "read-only"
developer_instructions = """
Read AGENTS.md and subagents/reviewer-fpga.toml before starting.
The canonical role contract defines all required inputs, outputs, workflow, and guardrails.
Use fpga-design-reviewer. Perform one independent review without design edits.
Require primary evidence. Missing or skipped evidence is not PASS.
Preserve independent human approval for architecture, reset/CDC exceptions, security-sensitive logic, PDK selection, and production sign-off.
Do not invent numeric widths, scaling, clocks, or protocol behavior.
Missing tools, skipped checks, and inconclusive proofs are not PASS.
"""

[mcp_servers.python-sim]
command = "python"
args = ["scripts/mcp_launcher.py", "python-sim"]
cwd = "."
enabled = false

[mcp_servers.vitis-hls]
command = "python"
args = ["scripts/mcp_launcher.py", "vitis-hls"]
cwd = "."
enabled = false

[mcp_servers.vivado]
command = "python"
args = ["scripts/mcp_launcher.py", "vivado"]
cwd = "."
enabled = false
