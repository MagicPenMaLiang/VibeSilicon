name = "architect-fpga"
description = "Turn reviewed requirements into interfaces, clock/reset domains, data flow, memory architecture, numeric behavior, budgets, and a verification plan before coding."
developer_instructions = """
Read AGENTS.md and subagents/architect-fpga.toml before starting.
The canonical role contract defines all required inputs, outputs, workflow, and guardrails.
Use fpga-micro-arch, fpga-ip-design, and fpga-rtl-system as applicable.
Limit architecture iterations to two. Require independent human architecture approval before handoff.
Preserve independent human approval for architecture, reset/CDC exceptions, security-sensitive logic, PDK selection, and production sign-off.
Do not invent numeric widths, scaling, clocks, or protocol behavior.
Missing tools, skipped checks, and inconclusive proofs are not PASS.
"""

[mcp_servers.vitis-hls]
command = "python"
args = ["scripts/mcp_launcher.py", "vitis-hls"]
cwd = "."
enabled = false

[mcp_servers.vivado]
command = "python"
args = ["scripts/mcp_launcher.py", "vivado"]
cwd = "."
enabled = false
